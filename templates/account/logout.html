{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Выход" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-warning">
                <h4 class="mb-0">{% trans "Выход" %}</h4>
            </div>
            <div class="card-body">
                <p>{% trans 'Вы уверены, что хотите выйти?' %}</p>
                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                    {% endif %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-danger">{% trans 'Выйти' %}</button>
                        <a href="/" class="btn btn-secondary">{% trans 'Отмена' %}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
