{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Календарь задач</h1>
</div>

<div id="calendar"></div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ru',
            timeZone: 'UTC',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: function(fetchInfo, successCallback, failureCallback) {
                const start = fetchInfo.startStr;
                const end = fetchInfo.endStr;
                const url = `/core/calendar/data/?start=${start}&end=${end}`;
                
                console.log('Загружаем события с URL:', url);
                
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('Получены события:', data);
                        successCallback(data);
                    })
                    .catch(error => {
                        console.error('Ошибка загрузки событий:', error);
                        failureCallback(error);
                    });
            },
            eventClick: function(info) {
                window.location.href = `/core/tasks/${info.event.id}/update/`;
            }
        });
        
        calendar.render();
        console.log('Календарь инициализирован');
    });
</script>
{% endblock %}
