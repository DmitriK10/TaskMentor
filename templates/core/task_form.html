{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% if object %}Редактировать задачу{% else %}Новая задача{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>{% if object %}Редактировать задачу{% else %}Создать задачу{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="{% url 'core:task_list' %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
